<!DOCTYPE html>
<html>
<head>
<title>Application Error</title>
<style>
body { background-color: #d4d0c8; font-family: Arial, Helvetica, sans-serif; font-size: 12px; margin: 0; }
table.cls_x1 { width: 100%; }
td.cls_x2 { background-color: #800000; color: #ffffff; font-weight: bold; padding: 4px; }
td.cls_x3 { padding: 8px; }
table.cls_x4 { background-color: #ffffff; border: 1px solid #808080; width: 100%; }
td.cls_x5 { padding: 6px; }
</style>
</head>
<body>
<table class="cls_x1" cellpadding="0" cellspacing="0" border="0">
<tr><td class="cls_x2" id="{{ rid('err_hdr') }}">Application Error</td></tr>
<tr><td class="cls_x3">
  <table class="cls_x4" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="cls_x5">
    <table cellpadding="4" cellspacing="0" border="0"><tr><td id="{{ rid('err_msg') }}">An unexpected error occurred. Reference: {{ reference }}</td></tr></table>
  </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
