<!DOCTYPE html>
<html>
<head>
<title>Navigation</title>
<style>
body { background-color: #808080; font-family: Arial, Helvetica, sans-serif; font-size: 11px; margin: 0; color: #ffffff; }
table.cls_n1 { width: 100%; }
td.cls_n2 { padding: 4px; }
table.cls_n3 { width: 100%; background-color: #707070; }
td.cls_n4 { padding: 3px; }
table.cls_n5 { width: 100%; }
a.cls_lnk { color: #ffff99; }
input, select, button { font-size: 10px; }
td.cls_ver { font-size: 9px; color: #cccccc; padding: 4px; }
</style>
</head>
<body>
<table class="cls_n1" cellpadding="0" cellspacing="0" border="0">
<tr><td class="cls_n2" id="{{ rid('nav_title') }}"><b>{{ cfg.inst_name }}</b></td></tr>
<tr><td>
  <table class="cls_n3" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="cls_n4">
    <table class="cls_n5" cellpadding="0" cellspacing="0" border="0">
    <tr><td><a class="cls_lnk" href="/search" target="content" id="{{ rid('nav_search_lnk') }}">{{ cfg.nav_search_label }}</a></td></tr>
    </table>
  </td></tr>
  </table>
</td></tr>
<tr><td class="cls_n2">
  <table cellpadding="2" cellspacing="0" border="0">
  <tr><td colspan="2" id="{{ rid('quick_hdr') }}">Quick Lookup</td></tr>
  <tr><td colspan="2">
    <form method="get" action="/search/results" target="content" id="{{ rid('quick_form') }}">
      <table cellpadding="1" cellspacing="0" border="0">
      <tr><td>{{ cfg.id_label_alt }}</td></tr>
      <tr><td><input type="text" name="identifier" id="{{ rid('quick_id') }}" size="12"></td></tr>
      <tr><td align="right"><button type="submit" id="{{ rid('quick_submit') }}">Submit</button></td></tr>
      </table>
    </form>
  </td></tr>
  </table>
</td></tr>
<tr><td class="cls_n2">
  <form method="post" action="/logout" target="_top" id="{{ rid('logout_form') }}">
    <button type="submit" id="{{ rid('logout_btn') }}">Log Off</button>
  </form>
  <span id="{{ rid('nav_user') }}">User: {{ username }}</span>
</td></tr>
</table>
<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="cls_ver" id="{{ rid('ver') }}">{{ cfg.version }}</td></tr></table>
</body>
</html>
